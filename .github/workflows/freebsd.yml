name: FreeBSD
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
      with:
        release: '15.1'
        usesh: true
        prepare: pkg install -y bash git rust curl pkgconf libxkbcommon wayland libX11 libXrandr libXi mesa-libs gtk3
        run: |-
          set -eu
          git --version
          export CARGO_TARGET_DIR=/var/tmp/nexopdf-target
          cargo test --locked --workspace -- --test-threads=1
          cargo build --locked -p nexopdf -p nexopdf-cli
