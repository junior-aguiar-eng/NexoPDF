name: Packaging lint
'on':
  push:
    branches:
    - main
    - release
    paths:
    - .github/**
    - packaging/**
    - assets/app-icon/**
    - assets/fonts/**
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install validators
      run: |-
        sudo apt-get update
        sudo apt-get install -y shellcheck desktop-file-utils appstream python3-yaml
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Workflow syntax
      run: actionlint
    - name: Shell scripts
      run: find packaging -name "*.sh" -print0 | xargs -0 shellcheck -x
    - name: Linux metadata
      run: |-
        desktop-file-validate packaging/linux/io.nexohub.nexopdf.desktop
        sed -e "s/@VERSION@/0.0.0/" -e "s/@DATE@/2026-01-01/" packaging/linux/io.nexohub.nexopdf.metainfo.xml.in > "$RUNNER_TEMP/nexopdf.metainfo.xml"
        appstreamcli validate --no-net --explain "$RUNNER_TEMP/nexopdf.metainfo.xml"
    - name: Packaging contracts
      run: |-
        python3 packaging/validate.py
        python3 -m unittest discover -s packaging -p test_release_version.py
    - name: PowerShell syntax
      run: |-
        $files = Get-ChildItem packaging/windows/*.ps1
        foreach ($file in $files) {
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
        }
      shell: pwsh
