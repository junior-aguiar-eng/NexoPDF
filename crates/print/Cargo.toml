[package]
name = "nexopdf-print"
description = "Printing: page selection, sizing (fit, actual, shrink, custom), multiple pages per sheet, booklets, posters, comments & forms; print-ready PDF and the system spooler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nexopdf-cos = { workspace = true }
nexopdf-content = { workspace = true }
nexopdf-model = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
tempfile = "3"
nexopdf-render = { workspace = true }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
