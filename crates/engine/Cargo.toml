[package]
name = "nexopdf-engine"
description = "NexoPDF engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nexopdf-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
nexopdf-render = { workspace = true }
nexopdf-cos = { workspace = true }
nexopdf-organize = { workspace = true }
nexopdf-annot = { workspace = true }
nexopdf-forms = { workspace = true }
nexopdf-xfa = { workspace = true }
nexopdf-edit = { workspace = true }
nexopdf-audit = { workspace = true }
nexopdf-redact = { workspace = true }
nexopdf-print = { workspace = true }
nexopdf-xfdf = { workspace = true }
nexopdf-sign = { workspace = true }
nexopdf-optimize = { workspace = true }
nexopdf-a11y = { workspace = true }
nexopdf-ocr = { workspace = true }
nexopdf-js = { workspace = true }
nexopdf-compare = { workspace = true }
nexopdf-preflight = { workspace = true }
nexopdf-export = { workspace = true }
nexopdf-fonts = { workspace = true }
nexopdf-create = { workspace = true }
nexopdf-model = { workspace = true }
nexopdf-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
