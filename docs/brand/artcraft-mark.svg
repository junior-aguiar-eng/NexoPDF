<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" role="img" aria-label="NexoPDF">
  <title>NexoPDF - Caneta de Pena Dourada</title>
  <defs>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="18%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="45%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="nibGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <!-- Subtle warm glow filter for high-res icons -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#78350F" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)" transform="translate(4, 4) scale(0.93)">
    <!-- Right Vane of the feather (Upper/outer wing) -->
    <path fill="url(#goldLight)" d="M 44,72 C 48,58 56,42 70,28 C 84,14 100,6 112,4 C 114,8 112,18 106,28 C 102,34 96,40 102,40 C 96,46 90,52 86,56 C 88,57 91,58 92,60 C 86,66 78,72 72,76 C 73,78 75,79 74,81 C 66,85 58,88 52,90 L 44,72 Z" stroke="#78350F" stroke-width="0.6" />

    <!-- Left Vane of the feather (Lower/inner wing with slits) -->
    <path fill="url(#goldDark)" d="M 42,74 C 40,64 42,52 48,40 C 50,36 54,32 58,28 C 54,33 50,38 48,45 C 44,48 40,54 38,62 C 34,66 32,72 32,78 C 35,76 38,76 40,78 C 34,84 32,92 34,98 L 44,74 Z" opacity="0.95" stroke="#78350F" stroke-width="0.6" />

    <!-- Central Quill Shaft / Rachis (curving gold spine) -->
    <path fill="url(#goldLight)" d="M 28,104 C 36,92 48,74 62,56 C 76,38 94,20 112,4 C 110,8 92,26 78,44 C 64,62 52,80 44,98 L 36,110 Z" stroke="#78350F" stroke-width="0.5" />

    <!-- Metallic Writing Nib (Pena de escrita) -->
    <path fill="url(#nibGrad)" d="M 16,122 L 28,104 L 42,108 L 22,124 Z" stroke="#78350F" stroke-width="0.8" />
    <!-- Nib metallic collar / ring -->
    <polygon points="26,102 30,105 40,96 36,93" fill="#FFFDF0" stroke="#78350F" stroke-width="0.5" />
    <!-- Nib slit -->
    <line x1="16" y1="122" x2="27" y2="111" stroke="#381502" stroke-width="1.4" stroke-linecap="round" />
    <!-- Nib breather hole -->
    <circle cx="28" cy="110" r="1.8" fill="#381502" />

    <!-- Delicate ink drop / golden sparkle accent -->
    <path fill="#FEF08A" d="M 12,124 Q 10,126 10,127 Q 10,128.5 11.5,128.5 Q 13,128.5 13,127 Q 13,126 12,124 Z" stroke="#78350F" stroke-width="0.4" />
    <!-- Star sparkle at the tip of feather -->
    <path fill="#FFFDF0" d="M 104,12 L 106,17 L 111,19 L 106,21 L 104,26 L 102,21 L 97,19 L 102,17 Z" opacity="0.95" />
  </g>
</svg>